name: taskflow

services:
  app:
    build: .
    image: taskflow:local
    env_file: .env
    environment:
      DB_PATH: /data/taskflow.db
      COOKIE_SECURE: "0"
    ports:
      - "127.0.0.1:8080:5000"
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    labels:
      logging: promtail
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/healthz', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# The application uses SQLite, so its database is the file in app-data, not a network service.
networks:
  frontend: {}
  backend:
    internal: true

volumes:
  app-data: {}
